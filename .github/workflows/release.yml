# Publishes @nelmad/calendar to npm from GitHub Actions through npm trusted
# publishing (OIDC): no npm token exists anywhere, and npm attaches a provenance
# attestation that links the published tarball to this commit and workflow run.
#
# Run it from the Actions tab on `main` after the release PR (version bump and
# CHANGELOG entry) is merged. The npm trusted publisher must name exactly:
# owner `Nelmad`, repository `calendar`, workflow `release.yml`, environment
# `npm-publish`. See RELEASING.md.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write # create the tag and the GitHub Release after publishing
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Resolve version and dist-tag
        id: release
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          case "${version}" in
            *-*) dist_tag=next; prerelease=true ;;
            *) dist_tag=latest; prerelease=false ;;
          esac
          published="$(npm view "${name}@${version}" version 2>/dev/null || true)"
          if [ "${published}" = "${version}" ]; then
            echo "::notice::${name}@${version} is already on npm; nothing to publish."
            publish=false
          else
            publish=true
          fi
          {
            echo "name=${name}"
            echo "version=${version}"
            echo "dist_tag=${dist_tag}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci

      - name: Typecheck and test
        if: steps.release.outputs.publish == 'true'
        run: |
          npm run typecheck
          npm test

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10. Upgrade only
      # now, so install and tests run with the same npm as the CI workflow.
      - name: Use npm with trusted publishing support
        if: steps.release.outputs.publish == 'true'
        run: npm install --global npm@11.21.0

      # prepublishOnly builds and verifies dist/. Provenance is generated
      # automatically for trusted publishing from a public repository.
      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        run: npm publish --tag "${{ steps.release.outputs.dist_tag }}"

      # The tag is created only after npm accepted the version, so a tag
      # always points at a published release.
      - name: Create tag and GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md." > release-notes.md
          fi
          flags=()
          if [ "${PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            "${flags[@]}"
