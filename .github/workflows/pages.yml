name: Deploy Storybook

# One Storybook per release line, side by side (scripts/pages/versions.json): /calendar/<line>/ with a version switcher
# in each manager, and /calendar/ redirecting to the line of the npm `latest` dist-tag. Pull requests build and assemble
# the site for inspection; pushes to main, manual runs on main and finished releases deploy it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The registry decides the root redirect and the prerelease marks at build time, and a release moves them only after
  # its version bump is already on main. The tag and GitHub Release that Release creates with GITHUB_TOKEN start no
  # workflow, so each completed Release run (the one after a late approval too) redeploys main.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

# Deploys from main keep the 'pages' group; each pull request and each manual build of another branch builds in its own
# group, so it never cancels a deploy, and a newer push cancels the older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'pages') || format('pages-build-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    # Named apart from the CI workflow's `build` check, which pull requests also run.
    name: Build the Storybook site
    # After a release only when it succeeded; this builds main, never the code of the run that triggered it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node --test scripts/pages/*.checks.mjs

      # The HEAD line from this commit, every other line from its tag in a git worktree (npm ci there), each with the npm
      # scripts versions.json lists for it, STORYBOOK_BASE_PATH=/calendar/<line>/ and --disable-telemetry.
      - run: node scripts/pages/assemble.mjs build --site "$RUNNER_TEMP/site" --work "$RUNNER_TEMP/lines"

      # The switcher in each manager, versions.json and the root index.html and iframe.html redirects; the npm registry
      # decides the latest line and which lines are still prereleases.
      - run: node scripts/pages/assemble.mjs assemble --site "$RUNNER_TEMP/site"

      # The assembled site: the input of the deploy job, and on pull requests the build to inspect.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-site
          path: ${{ runner.temp }}/site
          retention-days: 7
          overwrite: true

  # Runs only trusted actions, never the repository's code, so the write permissions stay here.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-site
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Re-runs and upload retries can leave a stale artifact on this workflow run.
      - name: Delete stale Pages artifact (if any)
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: github-pages
          failOnError: false

      # Like the storybook-site upload, this leaves out dotfiles (include-hidden-files: false); the site has none.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
